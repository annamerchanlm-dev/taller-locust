worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        # CAMBIO: con el valor por defecto (max_fails=1, fail_timeout=10s) un solo
        # reset de keep-alive sacaba una replica del grupo 10 s; con 3 replicas
        # eso produjo "no live upstreams" (rafaga de 502).
        server api:8000 resolve max_fails=3 fail_timeout=5s;
        keepalive 128;
        # CAMBIO: cerrar conexiones inactivas ANTES que uvicorn (5 s) elimina
        # la condicion de carrera que causaba "recv() failed (104)".
        keepalive_timeout 4s;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
